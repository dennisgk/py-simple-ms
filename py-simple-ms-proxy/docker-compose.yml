services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: py-simple-ms-proxy:sample
    container_name: py-simple-ms-proxy
    environment:
      - PROXY_PSK=${PROXY_PSK}
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST:-127.0.0.1}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_USER=${TURN_USER:-pyms}
      - TURN_PASSWORD=${TURN_PASSWORD:-pyms-pass}
    ports:
      - "8765:8765"
    restart: unless-stopped
    depends_on:
      - turn

  turn:
    image: coturn/coturn:4.6.3
    container_name: py-simple-ms-turn
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        EXT_IP="${TURN_EXTERNAL_IP:-}"
        if [ -z "$EXT_IP" ] && [ -n "${TURN_PUBLIC_HOST:-}" ] && command -v getent >/dev/null 2>&1; then
          EXT_IP="$(getent ahostsv4 "$TURN_PUBLIC_HOST" | awk 'NR==1{print $1}')"
        fi
        EXTERNAL_ARG=""
        if [ -n "$EXT_IP" ]; then
          EXTERNAL_ARG="--external-ip=$EXT_IP"
          echo "[turn] using external ip: $EXT_IP"
        else
          echo "[turn] TURN_EXTERNAL_IP not set and auto-resolve failed; starting without --external-ip"
        fi
        exec turnserver \
          -n \
          --listening-port=3478 \
          --realm=${TURN_REALM:-py-simple-ms.local} \
          --lt-cred-mech \
          --user=${TURN_USER:-pyms}:${TURN_PASSWORD:-pyms-pass} \
          --fingerprint \
          --no-cli \
          --listening-ip=0.0.0.0 \
          $EXTERNAL_ARG \
          --min-port=49160 \
          --max-port=49200
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
